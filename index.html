<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Memory — 4x3 (faceup → pieces → final)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Memory — Ghép 4×3</h1>

  <div class="info">
    <span id="timer">Thời gian: 0s</span>
    <span id="best-score">Thời gian nhanh nhất: -</span>
  </div>

  <div id="board-wrap">
    <div id="game-board" aria-label="Bàn chơi"></div>

    <!-- final full image (ẩn) -->
    <!-- TEST: đang dùng file bạn upload tại /mnt/data/final.jpg -->
    <!-- Khi deploy: put final.jpg into images/ and change src to "images/final.jpg" -->
    <img id="final-full" src="images/final.png" alt="Final full" />
  </div>

  <div class="controls">
    <button id="restart-btn">🔄 Chơi lại</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
