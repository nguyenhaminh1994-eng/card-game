<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Galaxy Code & Mystery Mode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Galaxy Code - Mystery Mode</h1>

  <div class="info">
    <span id="timer">Thời gian: 0s</span>
    <span id="best-score">Thời gian nhanh nhất: -</span>
  </div>

  <div id="board-wrap">
    <div id="game-board" aria-label="Bàn chơi"></div>
    <img id="final-full" src="images/final.png" alt="Final full" />
  </div>

  <div class="controls">
    <button id="restart-btn">🔄 Chơi lại</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
